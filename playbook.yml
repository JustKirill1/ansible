---
- name: Setup web host
  hosts: webservers
  become: yes
  vars_files:
    - vars/packages.yml

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
      notify: Restart nginx

    - name: Install required packages
      apt:
        name: "{{ packages_list }}"
        state: present

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow specific ports in UFW
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop: "{{ ufw_allowed_ports }}"

    - name: Ensure UFW is reloaded
      ufw:
        state: reloaded

  handlers:

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
